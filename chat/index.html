<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NBA Scouting Agent</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6f8;
    color: #1a1a2e;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── header ── */
  header {
    background: #0f2044;
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header svg { flex-shrink: 0; }
  header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .02em; }
  header p  { font-size: .75rem; color: #8ba3cc; margin-top: 1px; }

  /* ── chat area ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ── bubbles ── */
  .bubble-row {
    display: flex;
    flex-direction: column;
    max-width: 760px;
    width: 100%;
  }
  .bubble-row.user  { align-self: flex-end; align-items: flex-end; }
  .bubble-row.agent { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 11px 15px;
    border-radius: 12px;
    line-height: 1.55;
    font-size: .9rem;
    max-width: 100%;
    word-break: break-word;
  }
  .bubble-row.user .bubble {
    background: #0f2044;
    color: #fff;
    border-bottom-right-radius: 3px;
  }

  /* answer types */
  .bubble.answer {
    background: #fff;
    border: 1px solid #e0e4ec;
    border-bottom-left-radius: 3px;
  }
  .bubble.out_of_scope {
    background: #fff8f0;
    border: 1px solid #f5c97a;
    border-bottom-left-radius: 3px;
    color: #7a5000;
  }
  .bubble.needs_clarification {
    background: #f0f5ff;
    border: 1px solid #93b4f5;
    border-bottom-left-radius: 3px;
    color: #1a3a80;
  }

  /* ── badge ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: .7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: 2px 8px;
    border-radius: 99px;
    margin-bottom: 5px;
  }
  .badge.answer              { background: #e8f0fe; color: #1a56db; }
  .badge.out_of_scope        { background: #fff0d6; color: #92600a; }
  .badge.needs_clarification { background: #e8effe; color: #1a3a80; }

  .badge-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .badge.answer .badge-dot              { background: #1a56db; }
  .badge.out_of_scope .badge-dot        { background: #f59e0b; }
  .badge.needs_clarification .badge-dot { background: #4f80f0; }

  /* ── function tag ── */
  .fn-tag {
    font-size: .7rem;
    color: #888;
    margin-top: 5px;
  }

  /* ── table toggle ── */
  .table-toggle {
    margin-top: 8px;
    font-size: .78rem;
    color: #1a56db;
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
  }
  .table-toggle:hover { text-decoration: underline; }
  .table-toggle .arrow { transition: transform .15s; display: inline-block; }
  .table-toggle.open .arrow { transform: rotate(90deg); }

  /* ── data table ── */
  .table-wrap {
    display: none;
    margin-top: 10px;
    overflow-x: auto;
    border: 1px solid #e0e4ec;
    border-radius: 8px;
    background: #fff;
  }
  .table-wrap.visible { display: block; }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: .78rem;
  }
  th {
    background: #f0f4ff;
    color: #1a2a4a;
    font-weight: 600;
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid #d8dff0;
    white-space: nowrap;
  }
  td {
    padding: 7px 12px;
    border-bottom: 1px solid #f0f2f7;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) td { background: #f8f9fc; }
  tr.top-row td { font-weight: 600; }

  /* ── loading spinner ── */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #ccc;
    border-top-color: #1a56db;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── input bar ── */
  #input-bar {
    background: #fff;
    border-top: 1px solid #e0e4ec;
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  #question {
    flex: 1;
    border: 1px solid #c8d0e0;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: .9rem;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  #question:focus { border-color: #1a56db; }
  #send-btn {
    background: #0f2044;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
  }
  #send-btn:hover:not(:disabled) { background: #1a3a6e; }
  #send-btn:disabled { opacity: .5; cursor: default; }

  /* ── empty state ── */
  #empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #8a96b0;
    pointer-events: none;
  }
  #empty svg { opacity: .35; }
  #empty p { font-size: .9rem; }
</style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
    <circle cx="14" cy="14" r="13" stroke="#4a7fcb" stroke-width="2"/>
    <path d="M14 2 Q20 14 14 26 Q8 14 14 2Z" stroke="#4a7fcb" stroke-width="1.5" fill="none"/>
    <line x1="2" y1="14" x2="26" y2="14" stroke="#4a7fcb" stroke-width="1.5"/>
  </svg>
  <div>
    <h1>NBA Scouting Agent</h1>
    <p>Hustle &amp; defense analytics · 2025-26</p>
  </div>
</header>

<div id="chat">
  <div id="empty">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" stroke="#8a96b0" stroke-width="2"/>
      <path d="M24 4 Q32 24 24 44 Q16 24 24 4Z" stroke="#8a96b0" stroke-width="1.5" fill="none"/>
      <line x1="4" y1="24" x2="44" y2="24" stroke="#8a96b0" stroke-width="1.5"/>
    </svg>
    <p>Ask a defensive scouting question to get started.</p>
  </div>
</div>

<div id="input-bar">
  <input id="question" type="text" placeholder="e.g. Who leads the league in deflections per 36?" autocomplete="off" />
  <button id="send-btn">Ask</button>
</div>

<script>
const chat     = document.getElementById('chat');
const empty    = document.getElementById('empty');
const input    = document.getElementById('question');
const sendBtn  = document.getElementById('send-btn');

const BADGE_LABELS = {
  answer:              'Result',
  out_of_scope:        'Out of scope',
  needs_clarification: 'Needs clarification',
};

function formatValue(v) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number') {
    if (Number.isInteger(v)) return v.toString();
    // percentages: columns ending in _PCT or RATE
    return v.toFixed(3);
  }
  return String(v);
}

function buildTable(records) {
  if (!records || records.length === 0) return null;
  const cols = Object.keys(records[0]);
  const table = document.createElement('table');
  const thead = table.createTHead();
  const hr = thead.insertRow();
  cols.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c.replace(/_/g, ' ');
    hr.appendChild(th);
  });
  const tbody = table.createTBody();
  records.forEach((row, i) => {
    const tr = tbody.insertRow();
    if (i === 0) tr.classList.add('top-row');
    cols.forEach(c => {
      const td = tr.insertCell();
      td.textContent = formatValue(row[c]);
    });
  });
  return table;
}

function appendMessage(question, data) {
  empty.style.display = 'none';

  // user bubble
  const userRow = document.createElement('div');
  userRow.className = 'bubble-row user';
  const userBubble = document.createElement('div');
  userBubble.className = 'bubble';
  userBubble.style.background = '#0f2044';
  userBubble.style.color = '#fff';
  userBubble.textContent = question;
  userRow.appendChild(userBubble);
  chat.appendChild(userRow);

  // agent bubble
  const agentRow = document.createElement('div');
  agentRow.className = 'bubble-row agent';

  const rtype = data.response_type || 'answer';

  // badge
  const badge = document.createElement('div');
  badge.className = `badge ${rtype}`;
  const dot = document.createElement('span');
  dot.className = 'badge-dot';
  badge.appendChild(dot);
  badge.appendChild(document.createTextNode(BADGE_LABELS[rtype] || rtype));
  agentRow.appendChild(badge);

  // answer bubble
  const agentBubble = document.createElement('div');
  agentBubble.className = `bubble ${rtype}`;
  agentBubble.textContent = data.answer;
  agentRow.appendChild(agentBubble);

  // function tag
  if (data.function_matched && !['out_of_scope','needs_clarification'].includes(data.function_matched)) {
    const tag = document.createElement('div');
    tag.className = 'fn-tag';
    tag.textContent = `fn: ${data.function_matched}  ·  via ${data.method || '?'}`;
    agentRow.appendChild(tag);
  }

  // expandable table
  if (data.table && data.table.length > 0) {
    const toggle = document.createElement('button');
    toggle.className = 'table-toggle';
    toggle.innerHTML = '<span class="arrow">▶</span> Show full rankings';

    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const tbl = buildTable(data.table);
    if (tbl) wrap.appendChild(tbl);

    toggle.addEventListener('click', () => {
      const open = wrap.classList.toggle('visible');
      toggle.classList.toggle('open', open);
      toggle.querySelector('.arrow').parentNode.childNodes[1].textContent =
        open ? ' Hide rankings' : ' Show full rankings';
    });

    agentRow.appendChild(toggle);
    agentRow.appendChild(wrap);
  }

  chat.appendChild(agentRow);
  chat.scrollTop = chat.scrollHeight;
}

function appendLoading() {
  empty.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'bubble-row agent';
  row.id = 'loading-row';
  const b = document.createElement('div');
  b.className = 'bubble answer';
  b.innerHTML = '<span class="spinner"></span>Thinking…';
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  sendBtn.disabled = true;

  const loadingRow = appendLoading();

  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });
    const data = await res.json();
    loadingRow.remove();
    appendMessage(q, data);
  } catch (err) {
    loadingRow.remove();
    appendMessage(q, {
      response_type: 'out_of_scope',
      answer: 'Network error — is the server running?',
      function_matched: null,
      method: null,
      table: null,
    });
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', ask);
input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>

</body>
</html>
