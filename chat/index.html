<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NBA Scouting Agent</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f7;
    color: #1a1a2e;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── header ── */
  header {
    background: #0d1b36;
    color: #fff;
    padding: 16px 24px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: .01em;
  }
  header p {
    font-size: .78rem;
    color: #7a9acc;
    margin-top: 3px;
  }

  /* ── chat area ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ── bubbles ── */
  .bubble-row {
    display: flex;
    flex-direction: column;
    max-width: 780px;
    width: 100%;
  }
  .bubble-row.user  { align-self: flex-end; align-items: flex-end; }
  .bubble-row.agent { align-self: flex-start; align-items: flex-start; gap: 8px; }

  .user-bubble {
    background: #0d1b36;
    color: #fff;
    border-radius: 14px 14px 3px 14px;
    padding: 10px 15px;
    font-size: .9rem;
    line-height: 1.5;
    max-width: 100%;
    word-break: break-word;
  }

  /* ── badge ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: .68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 2px 8px;
    border-radius: 99px;
  }
  .badge.answer              { background: #dbeafe; color: #1d4ed8; }
  .badge.out_of_scope        { background: #fef3c7; color: #92400e; }
  .badge.needs_clarification { background: #ede9fe; color: #5b21b6; }
  .badge-dot {
    width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
  }
  .badge.answer .badge-dot              { background: #1d4ed8; }
  .badge.out_of_scope .badge-dot        { background: #d97706; }
  .badge.needs_clarification .badge-dot { background: #7c3aed; }

  /* ── stat card (normal answer) ── */
  .stat-card {
    background: #fff;
    border: 1px solid #e2e8f4;
    border-radius: 12px;
    padding: 18px 20px 16px;
    width: 100%;
    border-bottom-left-radius: 3px;
    box-shadow: 0 1px 2px rgba(13,27,54,.04);
  }
  .stat-card-top {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .stat-player {
    font-size: 1.5rem;
    font-weight: 800;
    color: #0d1b36;
    line-height: 1.15;
    letter-spacing: -.01em;
  }
  .stat-team {
    font-size: .74rem;
    font-weight: 600;
    color: #8b96ad;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .stat-number {
    font-size: 1.3rem;
    font-weight: 800;
    color: #1d4ed8;
    margin-left: auto;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }
  .stat-season {
    font-size: .68rem;
    color: #aab2c4;
    font-weight: 500;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .stat-answer-text {
    font-size: .85rem;
    color: #46527a;
    line-height: 1.65;
    border-top: 1px solid #eef1f8;
    padding-top: 12px;
    margin-top: 4px;
  }

  /* ── mini ranked list ── */
  .mini-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .mini-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 2px;
    font-size: .8rem;
    border-bottom: 1px solid #f0f2f8;
    border-radius: 5px;
    transition: background .12s;
  }
  .mini-row:last-child { border-bottom: none; }
  .mini-row:hover { background: #f7f9fd; }
  .mini-rank {
    width: 18px;
    text-align: right;
    color: #b3bbcc;
    font-weight: 700;
    font-size: .72rem;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .mini-rank.gold   { color: #d97706; }
  .mini-rank.silver { color: #6b7a99; }
  .mini-rank.bronze { color: #92400e; }
  .mini-name {
    flex: 1;
    font-weight: 600;
    color: #1a1a2e;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mini-team {
    font-size: .7rem;
    color: #aab2c4;
    font-weight: 500;
    flex-shrink: 0;
  }
  .mini-val {
    font-weight: 700;
    color: #375bc8;
    flex-shrink: 0;
    font-size: .8rem;
    min-width: 52px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ── non-answer bubbles (out_of_scope / needs_clarification) ── */
  .plain-bubble {
    padding: 12px 15px;
    border-radius: 12px 12px 3px 12px;
    line-height: 1.55;
    font-size: .9rem;
    max-width: 100%;
    word-break: break-word;
  }
  .plain-bubble.out_of_scope {
    background: #fffbeb;
    border: 1px solid #fcd34d;
    color: #78350f;
    box-shadow: 0 1px 2px rgba(217,119,6,.06);
  }
  .plain-bubble.needs_clarification {
    background: #f5f3ff;
    border: 1px solid #c4b5fd;
    color: #4c1d95;
    box-shadow: 0 1px 2px rgba(124,58,237,.06);
  }

  /* ── fn tag ── */
  .fn-tag {
    font-size: .66rem;
    color: #b8c0d1;
    font-weight: 500;
    letter-spacing: .01em;
  }

  /* ── full table toggle ── */
  .table-toggle {
    font-size: .76rem;
    color: #1d4ed8;
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
  }
  .table-toggle:hover { text-decoration: underline; }
  .table-toggle .arrow { transition: transform .15s; display: inline-block; }
  .table-toggle.open .arrow { transform: rotate(90deg); }

  /* ── audit toggle ("Why this answer?") — same visual treatment as
     .table-toggle, kept as a distinct class so its own placement/spacing
     rules don't couple to the ranking-table toggle's ── */
  .audit-toggle {
    font-size: .76rem;
    color: #1d4ed8;
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    margin-top: 6px;
  }
  .audit-toggle:hover { text-decoration: underline; }
  .audit-toggle .arrow { transition: transform .15s; display: inline-block; }
  .audit-toggle.open .arrow { transform: rotate(90deg); }

  .audit-box {
    display: none;
    margin-top: 8px;
    padding: 10px 13px;
    background: #f8f9fd;
    border: 1px solid #e2e8f4;
    border-radius: 8px;
    font-size: .78rem;
    line-height: 1.7;
  }
  .audit-box.visible { display: block; }
  .audit-box .audit-entry + .audit-entry {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed #e2e8f4;
  }
  .audit-kv { display: flex; gap: 6px; }
  .audit-kv .audit-key {
    flex-shrink: 0;
    width: 108px;
    color: #8a93a8;
    font-weight: 600;
  }
  .audit-kv .audit-val {
    color: #334060;
    font-variant-numeric: tabular-nums;
    word-break: break-word;
  }

  /* ── full table ── */
  .table-wrap {
    display: none;
    margin-top: 8px;
    overflow-x: auto;
    border: 1px solid #e2e8f4;
    border-radius: 8px;
    background: #fff;
  }
  .table-wrap.visible { display: block; }
  table { border-collapse: collapse; width: 100%; font-size: .76rem; font-variant-numeric: tabular-nums; }
  th {
    background: #f0f4ff;
    color: #1a2a4a;
    font-weight: 600;
    text-align: left;
    padding: 7px 11px;
    border-bottom: 1px solid #dbe3f4;
    white-space: nowrap;
  }
  td {
    padding: 6px 11px;
    border-bottom: 1px solid #f0f2f8;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  tr:nth-child(even) td { background: #f8f9fd; }

  /* ── chips (suggestion + follow-up) ── */
  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 0 0 4px;
  }
  .chip {
    background: #fff;
    border: 1px solid #d0d8ec;
    border-radius: 99px;
    padding: 5px 13px;
    font-size: .78rem;
    font-weight: 500;
    color: #2a3a5e;
    cursor: pointer;
    font-family: inherit;
    transition: background .12s, border-color .12s, box-shadow .12s, transform .08s;
    line-height: 1.4;
  }
  .chip:hover {
    background: #eef2ff;
    border-color: #93a8e8;
    box-shadow: 0 2px 6px rgba(29,78,216,.1);
    transform: translateY(-1px);
  }
  .chip:active {
    transform: translateY(0) scale(.97);
    box-shadow: none;
    transition-duration: .05s;
  }
  .chip:focus-visible {
    outline: 2px solid #1d4ed8;
    outline-offset: 2px;
  }

  .followup-chips {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed #e4e9f5;
  }
  .followup-chips .chip {
    background: #f0f4ff;
    border-color: #c3d0f4;
    font-size: .74rem;
    padding: 5px 12px;
  }
  .followup-chips .chip:hover {
    background: #dbeafe;
    border-color: #93c5fd;
  }
  .followup-label {
    font-size: .66rem;
    color: #aab2c4;
    margin-bottom: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .07em;
  }

  /* ── suggestion chips strip above input ── */
  #chip-bar {
    padding: 10px 16px 0;
    background: #f0f2f7;
    flex-shrink: 0;
  }

  /* ── input bar ── */
  #input-bar {
    background: #f0f2f7;
    padding: 10px 16px 14px;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  #question {
    flex: 1;
    border: 1px solid #c8d0e4;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: .9rem;
    font-family: inherit;
    background: #fff;
    outline: none;
    transition: border-color .15s;
  }
  #question:focus { border-color: #1d4ed8; }
  #send-btn {
    background: #0d1b36;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: .9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
    white-space: nowrap;
  }
  #send-btn:hover:not(:disabled) { background: #1a3a6e; }
  #send-btn:disabled { opacity: .45; cursor: default; }

  /* ── spinner (used in report/compare loading states) ── */
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #d0d8ec;
    border-top-color: #1d4ed8;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── message entrance transition ── */
  @keyframes messageIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .bubble-row { animation: messageIn .18s ease-out; }

  /* ── skeleton loading card (replaces plain spinner bubble in chat) ── */
  .skeleton-card {
    background: #fff;
    border: 1px solid #e2e8f4;
    border-radius: 12px;
    border-bottom-left-radius: 3px;
    padding: 18px 20px 16px;
    width: 100%;
    max-width: 780px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .skel-line {
    border-radius: 5px;
    background: linear-gradient(90deg, #eef1f8 25%, #e2e8f4 37%, #eef1f8 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .skel-top    { display: flex; gap: 12px; align-items: center; }
  .skel-name   { height: 22px; width: 42%; }
  .skel-num    { height: 18px; width: 22%; margin-left: auto; }
  .skel-row    { height: 13px; width: 100%; }
  .skel-row:nth-child(1) { width: 96%; }
  .skel-row:nth-child(2) { width: 88%; }
  .skel-row:nth-child(3) { width: 92%; }

  @media (prefers-reduced-motion: reduce) {
    .bubble-row { animation: none; }
    .skel-line  { animation: none; opacity: .7; }
  }

  /* ── mode toggle ── */
  #mode-bar {
    display: flex;
    gap: 6px;
    padding: 10px 16px 0;
    flex-shrink: 0;
  }
  .mode-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 8px 8px 0 0;
    padding: 8px 16px;
    font-size: .82rem;
    font-weight: 600;
    color: #6b7a99;
    cursor: pointer;
    font-family: inherit;
  }
  .mode-btn.active {
    background: #fff;
    border-color: #e2e8f4;
    border-bottom-color: #fff;
    color: #0d1b36;
  }

  /* ── report search bar ── */
  #report-bar {
    display: none;
    background: #f0f2f7;
    padding: 10px 16px 14px;
    gap: 10px;
    flex-shrink: 0;
  }
  #report-bar.visible { display: flex; }
  #report-bar label {
    font-size: .78rem;
    font-weight: 600;
    color: #334060;
    align-self: center;
    white-space: nowrap;
  }
  #player-input {
    flex: 1;
    border: 1px solid #c8d0e4;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: .9rem;
    font-family: inherit;
    background: #fff;
    outline: none;
    transition: border-color .15s;
  }
  #player-input:focus { border-color: #1d4ed8; }
  #generate-btn {
    background: #0d1b36;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: .9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
    white-space: nowrap;
  }
  #generate-btn:hover:not(:disabled) { background: #1a3a6e; }
  #generate-btn:disabled { opacity: .45; cursor: default; }

  /* ── report view (separate from chat) ── */
  #report-view {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 24px;
  }
  #report-view.visible { display: block; }

  .report-card {
    background: #fff;
    border: 1px solid #e2e8f4;
    border-radius: 14px;
    max-width: 780px;
    margin: 0 auto;
    overflow: hidden;
  }
  .report-header {
    background: #0d1b36;
    color: #fff;
    padding: 20px 24px;
  }
  .report-header .report-player {
    font-size: 1.4rem;
    font-weight: 800;
  }
  .report-header .report-season {
    font-size: .78rem;
    color: #7a9acc;
    margin-top: 3px;
  }

  .report-section {
    padding: 16px 24px;
    border-bottom: 1px solid #eef1f8;
  }
  .report-section:last-child { border-bottom: none; }
  .report-section-title {
    font-size: .95rem;
    font-weight: 700;
    color: #0d1b36;
    margin-bottom: 10px;
  }
  .report-row {
    padding: 7px 0;
    border-bottom: 1px solid #f4f6fb;
  }
  .report-row:last-child { border-bottom: none; }
  .report-row-label {
    font-size: .78rem;
    font-weight: 700;
    color: #334060;
    text-transform: uppercase;
    letter-spacing: .03em;
    margin-bottom: 2px;
  }
  .report-row-text {
    font-size: .85rem;
    color: #334060;
    line-height: 1.55;
  }
  .report-row-text.unqualified {
    color: #9aa3b8;
    font-style: italic;
  }

  /* ── caveat box (reuses needs_clarification palette for visual distinctness) ── */
  .caveat-box {
    margin-top: 6px;
    padding: 8px 12px;
    background: #f5f3ff;
    border: 1px solid #c4b5fd;
    border-left: 3px solid #7c3aed;
    border-radius: 6px;
    color: #4c1d95;
    font-size: .78rem;
    line-height: 1.5;
  }
  .caveat-box .caveat-label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    font-size: .68rem;
    display: block;
    margin-bottom: 3px;
  }

  .report-loading, .report-error {
    max-width: 780px;
    margin: 40px auto;
    text-align: center;
    color: #9aa3b8;
    font-size: .9rem;
  }
  .report-error { color: #92400e; }

  /* ── compare search bar ── */
  #compare-bar {
    display: none;
    background: #f0f2f7;
    padding: 10px 16px 14px;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #compare-bar.visible { display: flex; }
  #compare-bar label {
    font-size: .78rem;
    font-weight: 600;
    color: #334060;
    white-space: nowrap;
  }
  #compare-bar .compare-vs {
    font-size: .78rem;
    font-weight: 700;
    color: #9aa3b8;
  }
  #player-a-input, #player-b-input {
    flex: 1;
    border: 1px solid #c8d0e4;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: .9rem;
    font-family: inherit;
    background: #fff;
    outline: none;
    transition: border-color .15s;
  }
  #player-a-input:focus, #player-b-input:focus { border-color: #1d4ed8; }
  #compare-btn {
    background: #0d1b36;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: .9rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
    white-space: nowrap;
  }
  #compare-btn:hover:not(:disabled) { background: #1a3a6e; }
  #compare-btn:disabled { opacity: .45; cursor: default; }

  /* ── compare view: two-column, section-aligned ── */
  #compare-view {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 24px;
  }
  #compare-view.visible { display: block; }

  .compare-card {
    background: #fff;
    border: 1px solid #e2e8f4;
    border-radius: 14px;
    max-width: 920px;
    margin: 0 auto;
    overflow: hidden;
  }
  .compare-header {
    display: flex;
    background: #0d1b36;
    color: #fff;
  }
  .compare-header-col {
    flex: 1;
    padding: 20px 24px;
  }
  .compare-header-col:first-child { border-right: 1px solid rgba(255,255,255,.12); }
  .compare-header-col .report-player { font-size: 1.3rem; font-weight: 800; }
  .compare-header-col .report-season { font-size: .78rem; color: #7a9acc; margin-top: 3px; }

  .compare-section {
    padding: 16px 24px;
    border-bottom: 1px solid #eef1f8;
  }
  .compare-section:last-child { border-bottom: none; }
  .compare-section-title {
    font-size: .95rem;
    font-weight: 700;
    color: #0d1b36;
    margin-bottom: 10px;
  }
  .compare-row {
    padding: 8px 0;
    border-bottom: 1px solid #f4f6fb;
  }
  .compare-row:last-child { border-bottom: none; }
  .compare-row-label {
    font-size: .78rem;
    font-weight: 700;
    color: #334060;
    text-transform: uppercase;
    letter-spacing: .03em;
    margin-bottom: 5px;
  }
  .compare-row-cols {
    display: flex;
    gap: 18px;
  }
  .compare-row-cols > div { flex: 1; min-width: 0; }
  .compare-cell-text {
    font-size: .84rem;
    color: #334060;
    line-height: 1.5;
  }
  .compare-cell-text.unqualified {
    color: #9aa3b8;
    font-style: italic;
  }
  .compare-cell-text.winner {
    font-weight: 700;
    color: #0d1b36;
    background: #dbeafe;
    border-radius: 5px;
    padding: 2px 6px;
    margin: -2px -6px;
    display: inline-block;
  }

  /* ── empty state ── */
  #empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #9aa3b8;
    pointer-events: none;
    padding-bottom: 40px;
  }
  #empty .empty-icon-wrap {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #eef2ff, #e4e9f5 70%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #empty svg { opacity: .55; }
  #empty .empty-title {
    font-size: .95rem;
    font-weight: 700;
    color: #4a5578;
  }
  #empty p {
    font-size: .82rem;
    color: #9aa3b8;
    max-width: 280px;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <h1>NBA Scouting Agent</h1>
  <p>Ask about defense or offense. Get a real answer, backed by real numbers.</p>
</header>

<div id="mode-bar">
  <button class="mode-btn active" id="mode-ask">Ask a question</button>
  <button class="mode-btn" id="mode-report">Full scouting report</button>
  <button class="mode-btn" id="mode-compare">Compare</button>
</div>

<div id="chat">
  <div id="empty">
    <div class="empty-icon-wrap">
      <svg width="34" height="34" viewBox="0 0 44 44" fill="none">
        <circle cx="22" cy="22" r="20" stroke="#1d4ed8" stroke-width="2"/>
        <path d="M22 4 Q29 22 22 40 Q15 22 22 4Z" stroke="#1d4ed8" stroke-width="1.5" fill="none"/>
        <line x1="4" y1="22" x2="40" y2="22" stroke="#1d4ed8" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="empty-title">Ask about any player or team trend</div>
    <p>Click a suggestion chip above, or type a question below to get started.</p>
  </div>
</div>

<div id="report-view"></div>
<div id="compare-view"></div>

<div id="chip-bar">
  <div class="chips-row" id="suggest-chips"></div>
</div>

<div id="input-bar">
  <input id="question" type="text" placeholder="Ask about defense, hustle, play types, year-over-year trends…" autocomplete="off" />
  <button id="send-btn">Ask</button>
</div>

<div id="report-bar">
  <label for="player-input">Full scouting report for…</label>
  <input id="player-input" type="text" placeholder="e.g. Alex Caruso" autocomplete="off" />
  <button id="generate-btn">Generate</button>
</div>

<div id="compare-bar">
  <label>Compare…</label>
  <input id="player-a-input" type="text" placeholder="e.g. Alex Caruso" autocomplete="off" />
  <span class="compare-vs">vs.</span>
  <input id="player-b-input" type="text" placeholder="e.g. Herbert Jones" autocomplete="off" />
  <button id="compare-btn">Compare</button>
</div>

<script>
/* ── constants ── */
const SUGGEST_CHIPS = [
  'Best rim protector',
  'Best scorer in isolation',
  'Best pick-and-roll defender',
  "Who's the best off-screen shooter",
  'Underrated defenders',
  'Who cuts the most',
];

const BADGE_LABELS = {
  answer:              'Result',
  out_of_scope:        'Out of scope',
  needs_clarification: 'Needs clarification',
};

// key metric column + label per function_matched
const METRIC_COL = {
  deflections_per36:    { col: 'DEFLECTIONS_PER36',      label: 'deflections/36' },
  contest_profile_per36:{ col: 'TOTAL_CONTESTED_PER36',  label: 'contests/36' },
  boxout_conversion:    { col: 'BOXOUT_CONV_RATE',        label: 'box-out conv %', isPct: true },
  hustle_iq_composite:  { col: 'HUSTLE_IQ_COMPOSITE',    label: 'hustle IQ' },
  shot_suppression:     { col: 'PCT_PLUSMINUS',           label: 'FG% delta', isSigned: true },
  hustle_vs_suppression_gap: { col: 'GAP',               label: 'gap', isSigned: true },
  playtype_defense:     { col: 'PPP',                     label: 'PPP allowed' },
  playtype_offense:     { col: 'PPP',                     label: 'PPP' },
  year_over_year_delta: { col: 'DELTA',                   label: 'Δ (YoY)', isSigned: true },
  drive_efficiency:     { col: 'PTS_PER_DRIVE',            label: 'pts/drive' },
  college_leaderboard:  { col: 'PTS',                      label: '' }, // label overridden per-metric below
  college_efficiency_volume: { col: 'TS%',                 label: 'TS%', isPct: false },
};

// college_leaderboard ranks by whichever metric the question asked for
// (PTS, TRB, AST, USG%, TS%, BPM, PER) -- the column itself varies per
// result, unlike every other function here, so it's read directly off the
// row rather than hardcoded to one column.
const COLLEGE_LEADERBOARD_METRIC_LABEL = {
  'PTS': 'PTS', 'TRB': 'TRB', 'AST': 'AST', 'USG%': 'USG%',
  'TS%': 'TS%', 'BPM': 'BPM', 'PER': 'PER',
};

// team col varies by function
const TEAM_COL = {
  shot_suppression:     'PLAYER_LAST_TEAM_ABBREVIATION',
  year_over_year_delta: 'TEAM_CUR',
};

// name/team field names vary by data source: NBA-side functions use
// PLAYER_NAME/TEAM_ABBREVIATION (or TEAM_COL override above); the college
// draft-class layer uses name/school instead. Checked in this order so
// existing NBA behavior is unchanged.
function getPlayerName(row) {
  return row.PLAYER_NAME || row.name || '—';
}

function getTeamGeneric(row, fn) {
  const col = TEAM_COL[fn];
  if (col && row[col]) return row[col];
  return row.TEAM_ABBREVIATION || row.school || '—';
}

// Functions whose `table` is NOT a ranked list of players (either a single
// player's own category breakdown, or a single player's full stat line) --
// these get a distinct card template in buildStatCard() rather than the
// "top 5 players" ranking treatment, since that concept doesn't apply.
const NON_RANKING_FUNCTIONS = new Set(['signature_play_type', 'college_player_lookup']);

// follow-up chips per function
const FOLLOWUPS = {
  contest_profile_per36: [
    'Check perimeter suppression instead',
    'Who\'s improved most in contests this year?',
  ],
  shot_suppression: [
    'Who contests the most shots at the rim?',
    'Best perimeter defender',
  ],
  deflections_per36: [
    'Who declined the most in deflections?',
    'Who has the best defensive IQ?',
  ],
  hustle_iq_composite: [
    'Who leads in deflections per 36?',
    'Who declined most in hustle this year?',
  ],
  playtype_defense: [
    'Who\'s the best roll man defender in the league?',
    'Who navigates screens best on defense?',
    'Best scorer in isolation',
  ],
  playtype_offense: [
    'Best scorer in isolation',
    'Who cuts the most',
    "Who's the best off-screen shooter",
    'How does he defend the pick and roll?',
  ],
  hustle_vs_suppression_gap: [
    'Who suppresses shooting the most?',
    'Best rim protector',
  ],
  boxout_conversion: [
    'Who leads in deflections per 36?',
    'Most improved defender',
  ],
  year_over_year_delta: [
    'Who leads the league in deflections per 36 minutes?',
    'Best rim protector',
  ],
};

/* ── DOM refs ── */
const chat      = document.getElementById('chat');
const empty     = document.getElementById('empty');
const input     = document.getElementById('question');
const sendBtn   = document.getElementById('send-btn');
const chipBar   = document.getElementById('suggest-chips');

/* ── suggestion chips (persistent) ── */
function buildSuggestChips() {
  chipBar.innerHTML = '';
  SUGGEST_CHIPS.forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = label;
    btn.addEventListener('click', () => fireQuestion(label));
    chipBar.appendChild(btn);
  });
}
buildSuggestChips();

/* ── formatting helpers ── */
function formatValue(v, isSigned, isPct) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number') {
    if (isPct)    return (v * 100).toFixed(1) + '%';
    if (isSigned) return (v >= 0 ? '+' : '') + v.toFixed(3);
    if (Number.isInteger(v)) return v.toString();
    return v.toFixed(v < 1 ? 3 : 2);
  }
  return String(v);
}

function getTeam(row, fn) {
  return getTeamGeneric(row, fn);
}

function getMetricVal(row, fn) {
  // college_leaderboard ranks by whichever metric the question asked for
  // (PTS/TRB/AST/USG%/TS%/BPM/PER) -- the column present in the row IS the
  // ranked metric, so read it directly instead of a fixed column name.
  if (fn === 'college_leaderboard') {
    for (const col of Object.keys(COLLEGE_LEADERBOARD_METRIC_LABEL)) {
      if (row[col] !== undefined && row[col] !== null) {
        return { raw: row[col], label: COLLEGE_LEADERBOARD_METRIC_LABEL[col], isPct: false, isSigned: false };
      }
    }
    return null;
  }

  const m = METRIC_COL[fn];
  if (!m) return null;
  const raw = row[m.col];
  if (raw === undefined || raw === null) return null;
  return { raw, label: m.label, isPct: m.isPct, isSigned: m.isSigned };
}

/* ── stat card builder ── */
// Player-centric card: single player, own data broken into rows (a
// category breakdown for signature_play_type, or a full stat line for
// college_player_lookup) -- NOT a "top N players" ranking, so no mini-list
// of other players makes sense here. header/rows are pre-extracted by the
// caller since the two functions' table shapes differ (signature_play_type
// has no name field at all; college_player_lookup has name/school on a
// single row).
function buildPlayerCard(header, subheader, rows, answer) {
  const card = document.createElement('div');
  card.className = 'stat-card';

  const top = document.createElement('div');
  top.className = 'stat-card-top';

  const nameEl = document.createElement('div');
  nameEl.className = 'stat-player';
  nameEl.textContent = header;
  top.appendChild(nameEl);

  if (subheader) {
    const teamEl = document.createElement('div');
    teamEl.className = 'stat-team';
    teamEl.textContent = subheader;
    top.appendChild(teamEl);
  }
  card.appendChild(top);

  const seasonEl = document.createElement('div');
  seasonEl.className = 'stat-season';
  seasonEl.textContent = '2025–26 season';
  card.appendChild(seasonEl);

  // clean list of this player's own categories/stats — reuses mini-list's
  // styling (rank column repurposed as a plain row number) since it's
  // already the right visual shape for "a short list of labeled rows".
  const mini = document.createElement('div');
  mini.className = 'mini-list';
  rows.forEach((r, i) => {
    const line = document.createElement('div');
    line.className = 'mini-row';

    const rankEl = document.createElement('div');
    rankEl.className = 'mini-rank';
    rankEl.textContent = i + 1;
    line.appendChild(rankEl);

    const nameDiv = document.createElement('div');
    nameDiv.className = 'mini-name';
    nameDiv.textContent = r.label;
    line.appendChild(nameDiv);

    const valDiv = document.createElement('div');
    valDiv.className = 'mini-val';
    valDiv.textContent = r.value;
    line.appendChild(valDiv);

    mini.appendChild(line);
  });
  card.appendChild(mini);

  const textEl = document.createElement('div');
  textEl.className = 'stat-answer-text';
  textEl.textContent = answer;
  card.appendChild(textEl);

  return card;
}

function buildSignaturePlayTypeCard(data) {
  const { table, question, answer, resolved_player_name } = data;
  // Prefer the backend-resolved canonical name (e.g. the LLM matched "Alex
  // Karuso" to the real Alex Caruso) over the raw question text, so the
  // card header never disagrees with the answer body about which player
  // this is about. Falls back to the raw question only if the backend
  // didn't supply a resolved name (older API responses, or a not-found
  // case where there's nothing to resolve to).
  const header = resolved_player_name || question;
  const rows = table.map(c => ({
    label: (PLAYTYPE_LABELS[c.play_type] || c.play_type),
    value: (c.percentile * 100).toFixed(1) + '% pctile, ' + c.poss.toFixed(1) + ' poss/g',
  }));
  return buildPlayerCard(header, 'Offensive play-type breakdown', rows, answer);
}

// human-readable labels for signature_play_type's raw category codes,
// mirroring compute_offense.py's own _PLAYTYPE_OFFENSE_LABEL mapping so the
// UI doesn't show raw codes like "PRBallHandler".
const PLAYTYPE_LABELS = {
  Isolation: 'Isolation', PRBallHandler: 'Pick-and-roll ball handler',
  PRRollman: 'Pick-and-roll roll man', Postup: 'Post-up', Spotup: 'Spot-up',
  Handoff: 'Dribble handoff', Cut: 'Cut', OffScreen: 'Off-screen',
  Transition: 'Transition',
};

function buildCollegeLookupCard(data) {
  const { table, answer } = data;
  const row = table[0];
  const header = row.name;
  const subheader = row.status === 'international' ? 'International (no NCAA data)' : (row.school || '—');

  if (row.status === 'international') {
    return buildPlayerCard(header, subheader, [], answer);
  }

  const rows = [
    { label: 'PTS / TRB / AST', value: `${row.PTS} / ${row.TRB} / ${row.AST}` },
    { label: 'FG% / 3P% / eFG%', value: `${row['FG%']}% / ${row['3P%']}% / ${row['eFG%']}%` },
    { label: 'USG% / TS%', value: `${row['USG%']}% / ${row['TS%']}%` },
    { label: 'BPM / PER', value: `${row.BPM} / ${row.PER}` },
  ];
  return buildPlayerCard(header, subheader, rows, answer);
}

function buildStatCard(data) {
  const { table, function_matched: fn, answer } = data;
  if (!table || table.length === 0) return null;

  if (fn === 'signature_play_type') return buildSignaturePlayTypeCard(data);
  if (fn === 'college_player_lookup') return buildCollegeLookupCard(data);

  const row0 = table[0];
  const card = document.createElement('div');
  card.className = 'stat-card';

  // top line: name + team + key number
  const top = document.createElement('div');
  top.className = 'stat-card-top';

  const nameEl = document.createElement('div');
  nameEl.className = 'stat-player';
  nameEl.textContent = getPlayerName(row0);
  top.appendChild(nameEl);

  const teamEl = document.createElement('div');
  teamEl.className = 'stat-team';
  teamEl.textContent = getTeam(row0, fn);
  top.appendChild(teamEl);

  const mv = getMetricVal(row0, fn);
  if (mv) {
    const numEl = document.createElement('div');
    numEl.className = 'stat-number';
    numEl.textContent = formatValue(mv.raw, mv.isSigned, mv.isPct) + ' ' + mv.label;
    top.appendChild(numEl);
  }

  card.appendChild(top);

  const seasonEl = document.createElement('div');
  seasonEl.className = 'stat-season';
  seasonEl.textContent = '2025–26 season';
  card.appendChild(seasonEl);

  // mini top-5 list
  const mini = document.createElement('div');
  mini.className = 'mini-list';
  const top5 = table.slice(0, 5);
  const rankClasses = ['gold', 'silver', 'bronze', '', ''];

  top5.forEach((row, i) => {
    const mv2 = getMetricVal(row, fn);
    const line = document.createElement('div');
    line.className = 'mini-row';

    const rankEl = document.createElement('div');
    rankEl.className = `mini-rank ${rankClasses[i] || ''}`;
    rankEl.textContent = i + 1;
    line.appendChild(rankEl);

    const nameDiv = document.createElement('div');
    nameDiv.className = 'mini-name';
    nameDiv.textContent = getPlayerName(row);
    line.appendChild(nameDiv);

    const teamDiv = document.createElement('div');
    teamDiv.className = 'mini-team';
    teamDiv.textContent = getTeam(row, fn);
    line.appendChild(teamDiv);

    if (mv2) {
      const valDiv = document.createElement('div');
      valDiv.className = 'mini-val';
      valDiv.textContent = formatValue(mv2.raw, mv2.isSigned, mv2.isPct);
      line.appendChild(valDiv);
    }

    mini.appendChild(line);
  });
  card.appendChild(mini);

  // answer text / caveats
  const textEl = document.createElement('div');
  textEl.className = 'stat-answer-text';
  textEl.textContent = answer;
  card.appendChild(textEl);

  return card;
}

/* ── full table (rows 5-24) ── */
function buildFullTable(records) {
  if (!records || records.length <= 5) return null;
  const rest = records.slice(5);
  const cols = Object.keys(rest[0]);
  const table = document.createElement('table');
  const thead = table.createTHead();
  const hr = thead.insertRow();
  cols.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c.replace(/_/g, ' ');
    hr.appendChild(th);
  });
  const tbody = table.createTBody();
  rest.forEach((row, i) => {
    const tr = tbody.insertRow();
    if (i % 2 === 1) tr.style.background = '#f8f9fd';
    cols.forEach(c => {
      const td = tr.insertCell();
      td.textContent = formatValue(row[c]);
    });
  });
  return table;
}

/* ── follow-up chips ── */
function buildFollowupChips(fn) {
  const suggestions = FOLLOWUPS[fn];
  if (!suggestions || suggestions.length === 0) return null;

  const wrap = document.createElement('div');
  wrap.className = 'followup-chips';

  const lbl = document.createElement('div');
  lbl.className = 'followup-label';
  lbl.textContent = 'Ask next';
  wrap.appendChild(lbl);

  const row = document.createElement('div');
  row.className = 'chips-row';
  suggestions.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = q;
    btn.addEventListener('click', () => fireQuestion(q));
    row.appendChild(btn);
  });
  wrap.appendChild(row);
  return wrap;
}

/* ── main message renderer ── */
function appendMessage(question, data) {
  empty.style.display = 'none';

  // user bubble
  const userRow = document.createElement('div');
  userRow.className = 'bubble-row user';
  const userBubble = document.createElement('div');
  userBubble.className = 'user-bubble';
  userBubble.textContent = question;
  userRow.appendChild(userBubble);
  chat.appendChild(userRow);

  // agent row
  const agentRow = document.createElement('div');
  agentRow.className = 'bubble-row agent';

  const rtype = data.response_type || 'answer';
  const fn    = data.function_matched || '';

  // badge
  const badge = document.createElement('div');
  badge.className = `badge ${rtype}`;
  const dot = document.createElement('span');
  dot.className = 'badge-dot';
  badge.appendChild(dot);
  badge.appendChild(document.createTextNode(BADGE_LABELS[rtype] || rtype));
  agentRow.appendChild(badge);

  if (rtype === 'answer' && data.table && data.table.length > 0) {
    // stat card + mini list
    const card = buildStatCard(data);
    if (card) agentRow.appendChild(card);

    // full table toggle (rows 6+) — doesn't apply to non-ranking functions
    // (a single player's own category/stat breakdown isn't a "top N" list
    // with more rows to reveal).
    if (data.table.length > 5 && !NON_RANKING_FUNCTIONS.has(fn)) {
      const toggle = document.createElement('button');
      toggle.className = 'table-toggle';
      toggle.innerHTML = '<span class="arrow">▶</span> <span class="toggle-label">Show full rankings (#6–#' + data.table.length + ')</span>';

      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      const tbl = buildFullTable(data.table);
      if (tbl) wrap.appendChild(tbl);

      toggle.addEventListener('click', () => {
        const open = wrap.classList.toggle('visible');
        toggle.classList.toggle('open', open);
        toggle.querySelector('.toggle-label').textContent =
          open
            ? 'Hide full rankings'
            : `Show full rankings (#6–#${data.table.length})`;
      });

      agentRow.appendChild(toggle);
      agentRow.appendChild(wrap);
    }

    // fn tag
    const tag = document.createElement('div');
    tag.className = 'fn-tag';
    tag.textContent = `fn: ${fn}  ·  via ${data.method || '?'}`;
    agentRow.appendChild(tag);

    // audit toggle ("Why this answer?") — secondary detail level below the
    // fn/method provenance line, not competing with the primary answer.
    const auditParts = buildAuditToggle(data.audit);
    if (auditParts) {
      agentRow.appendChild(auditParts.toggle);
      agentRow.appendChild(auditParts.box);
    }

    // follow-up chips
    const followups = buildFollowupChips(fn);
    if (followups) agentRow.appendChild(followups);

  } else {
    // non-answer: plain styled bubble
    const bubble = document.createElement('div');
    bubble.className = `plain-bubble ${rtype}`;
    bubble.textContent = data.answer;
    agentRow.appendChild(bubble);
  }

  chat.appendChild(agentRow);
  chat.scrollTop = chat.scrollHeight;
}

/* ── loading indicator: skeleton card, mirrors the stat-card shape so the
   transition into the real answer doesn't jump in size/position ── */
function appendLoading() {
  empty.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'bubble-row agent';
  row.id = 'loading-row';

  const card = document.createElement('div');
  card.className = 'skeleton-card';
  card.innerHTML = `
    <div class="skel-top">
      <div class="skel-line skel-name"></div>
      <div class="skel-line skel-num"></div>
    </div>
    <div class="skel-line skel-row"></div>
    <div class="skel-line skel-row"></div>
    <div class="skel-line skel-row"></div>
  `;
  row.appendChild(card);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row;
}

/* ── core ask flow ── */
async function fireQuestion(q) {
  input.value = '';
  sendBtn.disabled = true;
  const loadingRow = appendLoading();
  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });
    const data = await res.json();
    loadingRow.remove();
    appendMessage(q, data);
  } catch {
    loadingRow.remove();
    appendMessage(q, {
      response_type: 'out_of_scope',
      answer: 'Network error — is the server running?',
      function_matched: null, method: null, table: null,
    });
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  await fireQuestion(q);
}

sendBtn.addEventListener('click', ask);
input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

/* ── mode toggle: Ask vs. Scouting Report vs. Compare ── */
const modeAskBtn     = document.getElementById('mode-ask');
const modeReportBtn  = document.getElementById('mode-report');
const modeCompareBtn = document.getElementById('mode-compare');
const chipBarWrap    = document.getElementById('chip-bar');
const inputBar       = document.getElementById('input-bar');
const reportBar      = document.getElementById('report-bar');
const reportView     = document.getElementById('report-view');
const playerInput    = document.getElementById('player-input');
const generateBtn    = document.getElementById('generate-btn');
const compareBar     = document.getElementById('compare-bar');
const compareView    = document.getElementById('compare-view');
const playerAInput   = document.getElementById('player-a-input');
const playerBInput   = document.getElementById('player-b-input');
const compareBtn     = document.getElementById('compare-btn');

function setMode(mode) {
  modeAskBtn.classList.toggle('active', mode === 'ask');
  modeReportBtn.classList.toggle('active', mode === 'report');
  modeCompareBtn.classList.toggle('active', mode === 'compare');

  chat.style.display        = mode === 'ask' ? 'flex' : 'none';
  chipBarWrap.style.display = mode === 'ask' ? 'block' : 'none';
  inputBar.style.display    = mode === 'ask' ? 'flex' : 'none';
  reportBar.classList.toggle('visible', mode === 'report');
  reportView.classList.toggle('visible', mode === 'report');
  compareBar.classList.toggle('visible', mode === 'compare');
  compareView.classList.toggle('visible', mode === 'compare');

  if (mode === 'report') playerInput.focus();
  else if (mode === 'compare') playerAInput.focus();
  else input.focus();
}
modeAskBtn.addEventListener('click', () => setMode('ask'));
modeReportBtn.addEventListener('click', () => setMode('report'));
modeCompareBtn.addEventListener('click', () => setMode('compare'));

/* ── caveat box builder (visually distinct, reused across all report sections) ── */
function buildCaveatBox(text) {
  const box = document.createElement('div');
  box.className = 'caveat-box';
  const label = document.createElement('span');
  label.className = 'caveat-label';
  label.textContent = 'Note';
  box.appendChild(label);
  box.appendChild(document.createTextNode(text));
  return box;
}

/* ── audit box builder ("Why this answer?") ──────────────────────────────
   Renders one or more audit entries (intent/parameters/qualifying_pool_size/
   routing_method/data_as_of) as a clean key-value list, not raw JSON. A
   section can carry multiple audit entries (one per underlying compute
   call, e.g. the Hustle section bundles 4 different functions) — each
   renders as its own labeled block, separated by a hairline, rather than
   collapsing distinct thresholds into one misleading summary. Entries that
   are null (e.g. a section with no data for the given season) are skipped
   silently — there is nothing to audit for those. ── */
function formatAuditDate(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatAuditParams(params) {
  const entries = Object.entries(params || {});
  if (entries.length === 0) return '(none)';
  return entries.map(([k, v]) => `${k}=${v}`).join(', ');
}

function buildAuditKV(key, value) {
  const row = document.createElement('div');
  row.className = 'audit-kv';
  const k = document.createElement('span');
  k.className = 'audit-key';
  k.textContent = key;
  const v = document.createElement('span');
  v.className = 'audit-val';
  v.textContent = value;
  row.appendChild(k);
  row.appendChild(v);
  return row;
}

function buildAuditBox(auditList) {
  const entries = (Array.isArray(auditList) ? auditList : [auditList]).filter(Boolean);
  if (entries.length === 0) return null;

  const box = document.createElement('div');
  box.className = 'audit-box';

  entries.forEach(a => {
    const entry = document.createElement('div');
    entry.className = 'audit-entry';
    entry.appendChild(buildAuditKV('Intent', a.intent || '—'));
    entry.appendChild(buildAuditKV('Parameters', formatAuditParams(a.parameters)));
    entry.appendChild(buildAuditKV(
      'Qualifying pool',
      a.qualifying_pool_size != null ? `${a.qualifying_pool_size} players` : '—'
    ));
    entry.appendChild(buildAuditKV('Routing', a.routing_method || '—'));
    entry.appendChild(buildAuditKV('Data as of', formatAuditDate(a.data_as_of) || '—'));
    box.appendChild(entry);
  });

  return box;
}

/* Returns {toggle, box} — caller appends both, in order, wherever the
   toggle should sit. Mirrors the table-toggle open/close pattern exactly
   (arrow rotation, label swap, .visible class) so the two collapsibles
   behave identically. */
function buildAuditToggle(auditList) {
  const box = buildAuditBox(auditList);
  if (!box) return null;

  const toggle = document.createElement('button');
  toggle.className = 'audit-toggle';
  toggle.innerHTML = '<span class="arrow">▶</span> <span class="toggle-label">Why this answer?</span>';

  toggle.addEventListener('click', () => {
    const open = box.classList.toggle('visible');
    toggle.classList.toggle('open', open);
  });

  return { toggle, box };
}

/* ── report card builder ── */
function buildReportCard(data) {
  const card = document.createElement('div');
  card.className = 'report-card';

  const header = document.createElement('div');
  header.className = 'report-header';
  const nameEl = document.createElement('div');
  nameEl.className = 'report-player';
  nameEl.textContent = data.player_name;
  header.appendChild(nameEl);
  const seasonEl = document.createElement('div');
  seasonEl.className = 'report-season';
  seasonEl.textContent = `${data.season} season`;
  header.appendChild(seasonEl);
  card.appendChild(header);

  data.sections.forEach(section => {
    const sec = document.createElement('div');
    sec.className = 'report-section';

    const title = document.createElement('div');
    title.className = 'report-section-title';
    title.textContent = section.title;
    sec.appendChild(title);

    section.rows.forEach(row => {
      const rowEl = document.createElement('div');
      rowEl.className = 'report-row';

      // multi-row sections (Hustle/Activity, Shot Suppression, play-type
      // profiles) have a meaningful per-metric label; single-row sections
      // (Gap, YoY) fold the label into the sentence itself already, so
      // skip a redundant label line for those.
      if (section.rows.length > 1) {
        const labelEl = document.createElement('div');
        labelEl.className = 'report-row-label';
        labelEl.textContent = row.label;
        rowEl.appendChild(labelEl);
      }

      const textEl = document.createElement('div');
      textEl.className = 'report-row-text' + (row.qualified ? '' : ' unqualified');
      textEl.textContent = row.text;
      rowEl.appendChild(textEl);

      row.caveats.forEach(caveat => {
        rowEl.appendChild(buildCaveatBox(caveat));
      });

      sec.appendChild(rowEl);
    });

    // per-section "Why this answer?" — audit is a list, one entry per
    // underlying compute call this section bundles (e.g. Hustle covers 4
    // distinct functions), so it lives once per section rather than once
    // per row or as a single block at the bottom of the whole report.
    const auditParts = buildAuditToggle(section.audit);
    if (auditParts) {
      sec.appendChild(auditParts.toggle);
      sec.appendChild(auditParts.box);
    }

    card.appendChild(sec);
  });

  return card;
}

async function generateReport() {
  const name = playerInput.value.trim();
  if (!name) return;

  generateBtn.disabled = true;
  reportView.innerHTML = '<div class="report-loading"><span class="spinner"></span>Generating report…</div>';

  try {
    const res = await fetch('/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_name: name }),
    });
    if (!res.ok) throw new Error('Request failed');
    const data = await res.json();
    reportView.innerHTML = '';
    reportView.appendChild(buildReportCard(data));
  } catch {
    reportView.innerHTML = '<div class="report-error">Could not generate a report — is the server running?</div>';
  } finally {
    generateBtn.disabled = false;
  }
}

generateBtn.addEventListener('click', generateReport);
playerInput.addEventListener('keydown', e => { if (e.key === 'Enter') generateReport(); });

/* ── compare card builder ── */
function buildCompareCell(row, isWinner) {
  const cell = document.createElement('div');

  const textEl = document.createElement('div');
  let cls = 'compare-cell-text';
  if (!row.qualified) cls += ' unqualified';
  else if (isWinner) cls += ' winner';
  textEl.className = cls;
  textEl.textContent = row.text;
  cell.appendChild(textEl);

  row.caveats.forEach(caveat => {
    cell.appendChild(buildCaveatBox(caveat));
  });

  return cell;
}

function buildCompareCard(data) {
  const card = document.createElement('div');
  card.className = 'compare-card';

  const header = document.createElement('div');
  header.className = 'compare-header';
  [data.player_a, data.player_b].forEach(name => {
    const col = document.createElement('div');
    col.className = 'compare-header-col';
    const nameEl = document.createElement('div');
    nameEl.className = 'report-player';
    nameEl.textContent = name;
    col.appendChild(nameEl);
    const seasonEl = document.createElement('div');
    seasonEl.className = 'report-season';
    seasonEl.textContent = `${data.season} season`;
    col.appendChild(seasonEl);
    header.appendChild(col);
  });
  card.appendChild(header);

  data.sections.forEach(section => {
    const sec = document.createElement('div');
    sec.className = 'compare-section';

    const title = document.createElement('div');
    title.className = 'compare-section-title';
    title.textContent = section.title;
    sec.appendChild(title);

    section.rows.forEach(row => {
      const rowEl = document.createElement('div');
      rowEl.className = 'compare-row';

      if (section.rows.length > 1) {
        const labelEl = document.createElement('div');
        labelEl.className = 'compare-row-label';
        labelEl.textContent = row.label;
        rowEl.appendChild(labelEl);
      }

      const cols = document.createElement('div');
      cols.className = 'compare-row-cols';
      cols.appendChild(buildCompareCell(row.a, row.winner === 'a'));
      cols.appendChild(buildCompareCell(row.b, row.winner === 'b'));
      rowEl.appendChild(cols);

      sec.appendChild(rowEl);
    });

    // per-section "Why this answer?" — audit reflects the qualification
    // thresholds/pool for this section's metric(s), same for both players
    // (they're ranked against the same computed pool), so one toggle per
    // section rather than one per player column.
    const auditParts = buildAuditToggle(section.audit);
    if (auditParts) {
      sec.appendChild(auditParts.toggle);
      sec.appendChild(auditParts.box);
    }

    card.appendChild(sec);
  });

  return card;
}

async function generateComparison() {
  const nameA = playerAInput.value.trim();
  const nameB = playerBInput.value.trim();
  if (!nameA || !nameB) return;

  compareBtn.disabled = true;
  compareView.innerHTML = '<div class="report-loading"><span class="spinner"></span>Comparing…</div>';

  try {
    const res = await fetch('/compare', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_a: nameA, player_b: nameB }),
    });
    if (!res.ok) throw new Error('Request failed');
    const data = await res.json();
    compareView.innerHTML = '';
    compareView.appendChild(buildCompareCard(data));
  } catch {
    compareView.innerHTML = '<div class="report-error">Could not generate a comparison — is the server running?</div>';
  } finally {
    compareBtn.disabled = false;
  }
}

compareBtn.addEventListener('click', generateComparison);
playerAInput.addEventListener('keydown', e => { if (e.key === 'Enter') generateComparison(); });
playerBInput.addEventListener('keydown', e => { if (e.key === 'Enter') generateComparison(); });
</script>
